# WorkshopC configuration - adopt preset
# Existing-project starting point: adopt the core checks first, then move
# to adopt-more once these findings are resolved.
#
# Rules and their options: https://github.com/RogueLemons/CrucibleC/blob/master/WorkshopC/docs/rules.md
# Why the presets differ:  https://github.com/RogueLemons/CrucibleC/blob/master/WorkshopC/docs/preset-rationale.md

# Paths configuration
# third_party_includes are not affected by rules
# An entry matches any path containing it, and case matters
third_party_includes:
  - external/
  - extern/
  - third_party/
  - third-party/
  - thirdparty/
  - ThirdParty/
  - 3rdparty/
  - 3rdParty/
  - vendor/
  - deps/
  - dependencies/
  - subprojects/
  - vcpkg_installed/

# Folder containing compile_commands.json, relative to this file (-p overrides it)
compile_commands_dir: build

# Rules section
# Rules can be: Off, Warning, Error
rules:
  # Suppression reason rule - requires a reason for each suppression
  suppression_reason_rule:
    level: Error

  # Enum rule - forbids enums completely, or requires a typedef and explicit casts from integers
  enum:
    level: Warning
    allow_enum_typedef: true

  # Private rule - fields with the private name may only be accessed by static getters and setters
  private:
    level: Warning
    private_field: _private
    setter_contains: private_
    getter_contains: private_

  # Private alternative rule - tagged fields may only be accessed by their own struct's functions
  private_alternative:
    level: Error

  # Function pointer rule - requires a typedef for every function pointer
  function_pointer:
    level: Off

  # Typedef struct rule - requires a typedef for every struct
  typedef_struct:
    level: Off

  # Assignment rule - variables are initialized at declaration, with optional null and argument checks
  assignment:
    level: Warning
    forbid_null_assign: false
    forbid_null_as_arg: false
    forbid_zero_init_for_objects_with_pointers: false
    forbid_arg_reassign: true
    forbid_mut_arg_pointer: true

  # Prefix namespace rule - names declared in headers start with a prefix built from their folder path
  prefix_namespace:
    level: Off
    top_dir: src
    work_from_top: true
    stop_at_count: 10
    use_separator: true
    separator: _
    apply_to_functions: false
    apply_to_structs: false
    apply_to_typedefs: false
    require_ifndef_for_filepath: true
    case_insensitive: true

  # Null check rule - pointer parameters are checked for null before they are dereferenced
  null_check:
    level: Warning
    allow_direct_ptr_in_if_statement: true

  # Argument pointer movement rule - non-const pointer parameters are tagged as move, out or modify
  argument_pointer_movement:
    level: Off
    require_operator_for_move_callsite: true
    require_operator_for_out_callsite: true
    require_operator_for_modify_callsite: false

  # Struct resource management rule - pod, raii and free structs with checked creation and cleanup
  struct_resource_management:
    level: Off
    pod_struct_creator_suffix: _pod
    raii_struct_creator_suffix: _make
    raii_struct_destroyer_suffix: _destroy
    raii_may_only_destroy_value_ref: true
    raii_struct_copy_suffix: _copy
    raii_struct_move_suffix: _move
    raii_may_only_move_value_ref: true
    raii_struct_return_suffix: _return
    raii_struct_valid_suffix: _valid
    raii_use_after_destroy: false
    allow_raii_struct_arrays: true
    raii_struct_array_destroyer_suffix: _destroy_array
    raii_destroy_in_reverse_order: true
    raii_standardized_destroy_definitions: true
    free_struct_creator_suffix: _init

  # Interfaces rule - standardizes the layout of interfaces and their vtables
  interfaces:
    level: Warning
    vtable_suffix: _vtable
    interface_suffix: _interface
    const_interface_suffix: _const_interface
    interface_must_have_fields_that_are_private_alternative: true

  # Restricted malloc rule - malloc, free and the other memory functions are only used in the listed functions
  restricted_malloc:
    level: Off
    list_of_allowed_malloc_functions:
      - memory_alloc
      - memory_alloc_array
      - memory_free

  # Single return rule - functions have a single, final return statement
  single_return:
    level: Off
    allow_early_return: true
    require_return_for_void: false

  # Strict switch rule - every switch has a default, and every case ends with a break or return
  strict_switch:
    level: Warning

  # Global variable rule - linkage, const and naming conventions for globals and static locals
  global_variable:
    level: Warning
    must_be_static: true
    must_be_const: false
    forbid_static_in_header: true
    mutable_require_prefix: false
    mutable_prefix: g_
    mutable_must_be_caps: false
    const_require_prefix: false
    const_prefix: G_
    const_must_be_caps: false
    mutable_local_static_require_prefix: false
    mutable_local_static_prefix: s_
    mutable_local_static_must_be_caps: false
    const_local_static_require_prefix: false
    const_local_static_prefix: S_
    const_local_static_must_be_caps: false

  # Reference pointer rule - tagged pointer parameters always point to a real object, never null
  reference_pointer:
    level: Error
    disable_null_check_rule_for_reference_pointers: true

  # Function discard rule - a returned value must be used, or discarded explicitly with (void)
  function_discard:
    level: Off

  # Array struct rule - arrays are declared inside structs, and single-array structs follow naming conventions
  array_struct:
    level: Off
    only_allow_array_passing_to_library_functions: true
    enforce_size_suffix_for_array_structs: true
    size_suffix_with_underscore: true
    flexible_size_name: flexible
    enforce_suffix_for_array_structs: true
    array_struct_suffix: _array
    struct_name_as_prefix: false
    use_naming_rules_on_one_array_field_structs_without_forbidding_public_arrays: true

  # Span struct rule - standardizes spans (pointer + size) and how arrays and buffers are passed
  span_struct:
    level: Warning
    span_struct_suffix: _span
    const_span_struct_suffix: _const_span
    only_allow_array_passing_to_library_functions_and_spans: false
    allow_string_literals_as_const_char_arguments: true
    only_allow_span_data_passing_in_one_line_static_functions: false
    allow_spans_to_be_given_fewer_elements_than_their_size: true
    require_span_immediately_after_array: false
    allow_pod_span_to_be_initialized_manually_if_static: false

  # Const field rule - forbids struct fields that are const themselves (pointers to const are fine)
  const_field:
    level: Warning

  # No goto rule - forbids goto statements
  no_goto:
    level: Warning
