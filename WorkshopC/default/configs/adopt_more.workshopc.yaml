# WorkshopC Configuration File
# Second adoption step: after adopt is clean, strengthen APIs and naming while
# leaving full resource-lifecycle enforcement for adopt_even_more.

# Paths configuration
# third_party_includes are not affected by rules
# An entry matches any path containing it, and case matters
third_party_includes:
  - external/
  - extern/
  - third_party/
  - third-party/
  - thirdparty/
  - ThirdParty/
  - 3rdparty/
  - 3rdParty/
  - vendor/
  - deps/
  - dependencies/
  - subprojects/
  - vcpkg_installed/

# Folder containing compile_commands.json, relative to this file (-p overrides it)
compile_commands_dir: build

# Rules section
# Rules can be: Off, Warning, Error
rules:
  # Suppression reason rule - requires a reason for each suppression
  # Keep exceptions reviewable as more rules become active.
  suppression_reason_rule:
    level: Error 

  # Enum rule - enforces typedef and explicit enum casting, or forbids enums completely
  # Prevent implicit mixing of enums and integers.
  enum:
    level: Error
    allow_enum_typedef: true

  # Private rule - forbids access of a private struct field
  private:
    level: Error
    private_field: _private
    setter_contains: private_
    getter_contains: private_

  # Private alternative rule - limits access of tagged struct fields
  private_alternative:
    level: Error

  # Function pointer rule - requires typedef for all function pointers
  # Name callback types once so public signatures stay readable.
  function_pointer:
    level: Warning

  # Typedef struct rule - requires typedef for all structs
  typedef_struct:
    level: Off

  # Assignment rule - require primitives to be assigned at declaration
  # Require deliberate initialization and discourage mutation through arguments.
  assignment:
    level: Error
    forbid_null_assign: false
    forbid_null_as_arg: false
    forbid_zero_init_for_objects_with_pointers: false
    forbid_arg_reassign: true
    forbid_mut_arg_pointer: true

  # Prefix namespace rule - require header declarations to include folder structure in name
  # Warn on module naming so existing APIs can be migrated incrementally.
  prefix_namespace:
    level: Warning
    top_dir: src
    work_from_top: true
    stop_at_count: 10
    use_separator: true
    separator: _
    apply_to_functions: false
    apply_to_structs: false
    apply_to_typedefs: false
    require_ifndef_for_filepath: true
    case_insensitive: true

  # Null check rule - require first use of pointer argument to be checked if null
  # Make nullable pointer use explicit before dereferencing.
  null_check:
    level: Error
    allow_direct_ptr_in_if_statement: true

  # Argument pointer movement rule - require use of movement notation for non-const pointers
  argument_pointer_movement:
    level: Off
    require_operator_for_move_callsite: true
    require_operator_for_out_callsite: true
    require_operator_for_modify_callsite: false

  # Struct resource management rule - require use of RAII with structs that manage resources
  struct_resource_management:
    level: Off
    pod_struct_creator_suffix: _pod
    raii_struct_creator_suffix: _make
    raii_struct_destroyer_suffix: _destroy
    raii_may_only_destroy_value_ref: true
    raii_struct_copy_suffix: _copy
    raii_struct_move_suffix: _move
    raii_may_only_move_value_ref: true
    raii_struct_return_suffix: _return
    raii_struct_valid_suffix: _valid
    raii_use_after_destroy: false
    allow_raii_struct_arrays: true
    raii_struct_array_destroyer_suffix: _destroy_array
    raii_destroy_in_reverse_order: true
    raii_standardized_destroy_definitions: true
    free_struct_creator_suffix: _init

  # Interfaces rule - standardizes how interfaces and vtables are used
  # Give dynamic dispatch a consistent object-and-vtable shape.
  interfaces:
    level: Error
    vtable_suffix: _vtable
    interface_suffix: _interface
    const_interface_suffix: _const_interface
    interface_must_have_fields_that_are_private_alternative: true

  # Restricted malloc rule - restricts the use of malloc/calloc/realloc/free/strdup/strndup/asprintf/getline/realpath to only the allowed functions
  restricted_malloc:
    level: Off
    list_of_allowed_malloc_functions:
      - memory_alloc
      - memory_alloc_array
      - memory_free

  # Single return rule - requires functions to have a single return statement
  single_return:
    level: Warning
    allow_early_return: true
    require_return_for_void: false

  # Strict switch rule - require all switch statements to have a default and all cases include a break/return
  # Reject unhandled states and fallthrough in control flow.
  strict_switch:
    level: Error

  # Global variable rule - require naming and safety conventions
  # Keep global state file-local and progressively standardize its names.
  global_variable:
    level: Error
    must_be_static: true
    must_be_const: false
    forbid_static_in_header: true
    mutable_require_prefix: false
    mutable_prefix: g_
    mutable_must_be_caps: false
    const_require_prefix: false
    const_prefix: G_
    const_must_be_caps: false
    mutable_local_static_require_prefix: false
    mutable_local_static_prefix: s_
    mutable_local_static_must_be_caps: false
    const_local_static_require_prefix: false
    const_local_static_prefix: S_
    const_local_static_must_be_caps: false

  # Reference pointer rule - tag system for pointers to ensure pointer of real object (not nullable)
  # Distinguish guaranteed-object parameters from nullable pointers.
  reference_pointer:
    level: Error
    disable_null_check_rule_for_reference_pointers: true

  # Function discard rule - forbids discarding return values of functions that return a value
  # Ensure status and error results are not silently ignored.
  function_discard:
    level: Warning

  # Array struct rule - only allows arrays to be declared in structs
  array_struct:
    level: Off
    only_allow_array_passing_to_library_functions: true
    enforce_size_suffix_for_array_structs: true
    size_suffix_with_underscore: true
    flexible_size_name: flexible
    enforce_suffix_for_array_structs: true
    array_struct_suffix: _array
    struct_name_as_prefix: false
    use_naming_rules_on_one_array_field_structs_without_forbidding_public_arrays: true

  # Span struct rule - standardize spans (pointer + length) for arrays and buffers
  # Pair buffer pointers with sizes before enforcing stricter span use later.
  span_struct:
    level: Warning
    span_struct_suffix: _span
    const_span_struct_suffix: _const_span
    only_allow_array_passing_to_library_functions_and_spans: true
    only_allow_span_data_passing_in_one_line_static_functions: false
    allow_spans_to_be_given_fewer_elements_than_their_size: true
    require_span_immediately_after_array: true
    allow_pod_span_to_be_initialized_manually_if_static: false

  # Const field rule - forbids struct fields that are const (but not pointer to const)
  const_field:
    level: Warning

  # No goto rule - forbids the use of goto statements
  no_goto:
    level: Warning