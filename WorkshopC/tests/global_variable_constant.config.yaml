# WorkshopC Configuration File

third_party_includes:
  - external/

rules:
  global_variable:
    level: Warning
    require_prefix: false
    prefix: g_
    must_be_caps: true
    must_be_static: false
    must_be_const: true
    treat_local_static_as_global: true
    require_local_static_prefix: false
    local_static_prefix: s_
    forbid_static_in_header: false
