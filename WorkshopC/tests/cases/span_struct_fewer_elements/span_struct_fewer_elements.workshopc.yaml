# Span struct checks where a span may be given fewer elements than its array has

third_party_includes:
  - external/

rules:
  span_struct:
    level: Warning
    only_allow_array_passing_to_library_functions_and_spans: false
    span_struct_suffix: _span
    const_span_struct_suffix: _const_span
    allow_spans_to_be_given_fewer_elements_than_their_size: true

  struct_resource_management:
    level: Warning
    pod_struct_creator_suffix: _pod
    free_struct_creator_suffix: _init
