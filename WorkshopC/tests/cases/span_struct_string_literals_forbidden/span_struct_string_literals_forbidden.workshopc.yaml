# String literals are arrays like any other without the option

third_party_includes:
  - external/

rules:
  span_struct:
    level: Warning
    only_allow_array_passing_to_library_functions_and_spans: true
    allow_string_literals_as_const_char_arguments: false
    span_struct_suffix: _span
    const_span_struct_suffix: _const_span
