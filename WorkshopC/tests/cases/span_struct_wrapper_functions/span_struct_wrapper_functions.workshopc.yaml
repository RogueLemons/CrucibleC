# Span struct checks where span data is only handed on inside one-statement static wrappers

third_party_includes:
  - external/

rules:
  span_struct:
    level: Warning
    only_allow_array_passing_to_library_functions_and_spans: true
    only_allow_span_data_passing_in_one_line_static_functions: true
    span_struct_suffix: _span
    const_span_struct_suffix: _const_span
