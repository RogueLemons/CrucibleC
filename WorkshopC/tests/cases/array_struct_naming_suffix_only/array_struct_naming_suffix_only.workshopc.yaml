# Array struct rule naming with only the array struct suffix and the element struct prefix

rules:
  array_struct:
    level: Warning
    only_allow_array_passing_to_library_functions: false
    enforce_size_suffix_for_array_structs: false
    size_suffix_with_underscore: true
    flexible_size_name: flexible
    enforce_suffix_for_array_structs: true
    array_struct_suffix: _array
    struct_name_as_prefix: false
